name = "zfb-example-webshop"
compatibility_date = "2026-05-01"

# REQUIRED. The zfb Cloudflare adapter threads `env` to SSR routes via
# `AsyncLocalStorage` from `node:async_hooks`; without `nodejs_compat`
# the Worker fails to start with `No such module "node:async_hooks"`.
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets deploy model (migrated from Cloudflare Pages
# advanced mode — see issue #23). `main` is the SSR Worker the zfb
# adapter emits; `[assets]` serves the static build output (the compiled
# CSS) alongside it. The adapter emits `dist/.assetsignore` (excluding
# `_worker.js` / `_zfb_inner.mjs`) so the Worker source is never served
# as a public asset.
main = "./dist/_worker.js"

# The two keys below MUST stay ABOVE the `[assets]` table: in TOML any key
# written after a table header belongs to that table, so `workers_dev` /
# `preview_urls` placed lower would be parsed as `[assets]` fields —
# wrangler warns "Unexpected fields found in assets field" and then
# silently ignores them.

# Production is served on the custom domain (`[[routes]]` below) AND on
# `zfb-example-webshop.<account>.workers.dev`. Keeping workers.dev on is
# not merely convenience: the PR workflow's `pr-<N>-…workers.dev` preview
# URLs only route while the workers.dev subdomain is enabled. Inheritable,
# so the `[env.preview]` worker gets its own workers.dev URL too.
workers_dev = true

# Per-deploy version preview URLs — the `pr-<N>-…workers.dev` hosts emitted
# by `wrangler versions upload --preview-alias`, which the pull_request path
# of deploy.yml depends on. Set EXPLICITLY because `preview_urls` defaults to
# *match* `workers_dev`: the day someone flips `workers_dev = false` to stop
# serving production on workers.dev, an omitted `preview_urls` would follow it
# to false and every PR preview URL would silently disappear too.
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
# SSR-only app: no static index.html exists, so an unmatched path must
# fall through to the Worker, not to Cloudflare's asset 404. With
# `run_worker_first = false`, real static assets (the CSS) are served
# directly and everything else invokes the Worker.
not_found_handling = "404-page"
run_worker_first = false

# Custom domain — PRODUCTION ONLY. `custom_domain = true` tells Cloudflare to
# create and manage the DNS record and TLS certificate for this hostname,
# rather than matching an existing zone route pattern. This is a TOP-LEVEL
# `[[routes]]` and must stay ABOVE `[env.preview]`, since every table written
# after that header is scoped into the preview environment.
#
# Creating the route needs `Zone · Workers Routes · Edit` on the shared
# CLOUDFLARE_API_TOKEN, on top of the account-level permissions the rest of
# the deploy uses — see docs/cloudflare-setup.md. Until the token carries it,
# the deploy's route step fails while the Worker itself still uploads.
[[routes]]
pattern = "zfb-example-webshop.takazudomodular.com"
custom_domain = true

# Production D1 database. The binding name `DB` is what becomes `env.DB`
# inside an SSR route. `database_id` is produced by `wrangler d1 create`
# (run once via .github/workflows/d1-bootstrap.yml — CI has the
# CLOUDFLARE_* secrets; local dev does not).
[[d1_databases]]
binding = "DB"
database_name = "webshop"
database_id = "c7596e55-1342-4eeb-a662-e6bd9f0bf720"

# Preview environment. Unlike Pages' implicit per-branch preview scoping,
# a Workers named environment deploys as a SEPARATE Worker
# (`zfb-example-webshop-preview`), so PRs never touch the production
# Worker or its bindings. `main`, `[assets]`, `compatibility_flags`,
# `workers_dev`, and `preview_urls` are inheritable and carry over from the
# top level; `d1_databases` is NON-inheritable, so the block below is what
# binds the preview Worker to its OWN database (`webshop-preview`) — the
# isolation guarantee that keeps a PR from mutating production shop data.
[env.preview]
# `routes` is ALSO inheritable, and that is the trap this line closes: left
# implicit, the preview Worker would inherit the production `[[routes]]` above
# and try to claim zfb-example-webshop.takazudomodular.com for itself, so a PR
# preview could take over the real domain. An explicit empty list overrides the
# inherited value; previews stay on their generated `*.workers.dev` URLs.
routes = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "webshop-preview"
database_id = "83cc7647-8543-431c-9cc6-28e9551fc6d9"
