# Canonical zfb-demo deploy workflow (S4 standalone-shape template).
#
# PARAMETERIZE per demo before committing into the demo repo:
#   - Replace every occurrence of  zfb-example-webshop  with the Cloudflare
#     Pages project name (also the demo repo name):
#       zfb-example-blog | zfb-example-corporate-website | zfb-example-webshop
#   - The webshop (#316 / S7) additionally needs a D1 migrate step — see
#     the README "Webshop D1 addendum" section. Insert it AFTER "Build" and
#     BEFORE "Deploy to Cloudflare Pages".
#
# The zfb CLI ships as prebuilt platform binaries via the @takazudo/zfb
# npm package (optionalDependencies select the right binary per OS/arch),
# so a plain `pnpm install` provides everything — no source build needed.
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify zfb CLI
        run: pnpm exec zfb --version

      - name: Build
        run: pnpm build

      # === WEBSHOP-ONLY (S7 / #316) D1 MIGRATE STEP ===
      # Apply numbered migrations/*.sql to the remote D1 database before
      # the deploy. Idempotent: wrangler tracks applied migrations in the
      # d1_migrations table, so a re-run applies only new files.
      #
      # Event-aware target (see #4): pull_request runs migrate the PREVIEW
      # database (`webshop-preview`), push-to-main runs migrate PRODUCTION
      # (`webshop`). This mirrors `wrangler.toml`, which binds preview
      # deploys to their own DB so a PR never mutates production shop data.
      # The preview DB lives under `[env.preview]`, so it is only resolvable
      # with `--env preview`; without it wrangler errors "Couldn't find a
      # D1 DB with the name or binding 'webshop-preview'". Production lives
      # at top-level config — no `--env` (there is no `[env.production]`).
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@4
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            wrangler d1 migrations apply webshop-preview --env preview --remote
          else
            wrangler d1 migrations apply webshop --remote
          fi

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Compute deploy branch slug
        id: branch
        env:
          GITHUB_HEAD_REF_VAL: ${{ github.head_ref }}
          GITHUB_REF_NAME_VAL: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Cloudflare Pages branch names cannot contain slashes; replace with hyphens.
            DEPLOY_BRANCH=$(echo "${GITHUB_HEAD_REF_VAL}" | tr '/' '-')
          else
            DEPLOY_BRANCH="main"
          fi
          echo "deploy_branch=${DEPLOY_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Idempotent: create on first run, no-op on subsequent runs.
          # wrangler@4 no longer auto-creates the project on `pages deploy`.
          out=$(wrangler pages project create zfb-example-webshop \
            --production-branch=main 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "Project created."
          elif echo "$out" | grep -qE "already exists|8000077|duplicate"; then
            echo "Project already exists — continuing."
          else
            echo "Project create failed with unexpected error."
            exit "$rc"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ steps.branch.outputs.deploy_branch }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3..."
            if wrangler pages deploy dist \
              --project-name=zfb-example-webshop \
              --branch="${DEPLOY_BRANCH}" \
              --commit-hash="${GITHUB_SHA}" \
              --commit-message="Deploy: ${GITHUB_SHA}"; then
              echo "Deploy succeeded on attempt $attempt"
              if [ "${DEPLOY_BRANCH}" = "main" ]; then
                echo "deploy_url=https://zfb-example-webshop.pages.dev/" >> "$GITHUB_OUTPUT"
              else
                echo "deploy_url=https://${DEPLOY_BRANCH}.zfb-example-webshop.pages.dev/" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Deploy failed, retrying in 150 seconds..."
              sleep 150
            fi
          done
          echo "Deploy failed after 3 attempts"
          exit 1

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          DEPLOY_BRANCH: ${{ steps.branch.outputs.deploy_branch }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const deployBranch = process.env.DEPLOY_BRANCH;
            const marker = '<!-- cf-preview-branch -->';
            const body = `${marker}\n### Preview deployed\n\nBranch \`${deployBranch}\` is live at: ${deployUrl}\n\n_Updated for commit \`${context.sha.substring(0, 7)}\`._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
