# Cloudflare Workers Static Assets deploy workflow.
#
# Migrated from Cloudflare Pages advanced mode (issue #23). The zfb
# Cloudflare adapter emits a Workers-ready `dist/` (SSR `dist/_worker.js`
# + `dist/.assetsignore` that hides the worker source from asset
# serving), so deploy is a plain `wrangler deploy` driven by
# `wrangler.toml`.
#
# Event-aware two-environment model (mirrors wrangler.toml):
#   - push to main  -> production Worker `zfb-example-webshop`
#                      (top-level config, D1 `webshop`)
#   - pull_request  -> preview Worker `zfb-example-webshop-preview`
#                      (`--env preview`, D1 `webshop-preview`)
# A Workers named environment deploys as a SEPARATE Worker (unlike Pages'
# implicit per-branch previews), so a PR never touches the production
# Worker or its database.
#
# The zfb CLI ships as prebuilt platform binaries via the @takazudo/zfb
# npm package (optionalDependencies select the right binary per OS/arch),
# so a plain `pnpm install` provides everything — no source build needed.
name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify zfb CLI
        run: pnpm exec zfb --version

      - name: Build
        run: pnpm build

      # === D1 MIGRATE (remote) ===
      # Apply numbered migrations/*.sql to the remote D1 database before
      # the deploy. Idempotent: wrangler tracks applied migrations in the
      # d1_migrations table, so a re-run applies only new files.
      #
      # Event-aware target: pull_request migrates the PREVIEW database
      # (`webshop-preview`), push-to-main migrates PRODUCTION (`webshop`).
      # This mirrors `wrangler.toml`, which binds the preview Worker to its
      # own DB so a PR never mutates production shop data. The preview DB
      # lives under `[env.preview]`, so it is only resolvable with
      # `--env preview`; without it wrangler errors "Couldn't find a D1 DB
      # with the name or binding 'webshop-preview'". Production lives at
      # top-level config — no `--env` (there is no `[env.production]`).
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec wrangler d1 migrations apply webshop-preview --env preview --remote
          else
            pnpm exec wrangler d1 migrations apply webshop --remote
          fi

      # === DEPLOY WORKER ===
      # pull_request deploys the preview Worker (`--env preview` →
      # `zfb-example-webshop-preview`); push-to-main deploys production
      # (`zfb-example-webshop`). `wrangler deploy` creates the Worker on
      # first run (no separate "ensure project exists" step, unlike Pages).
      # set +e is used only so the deploy output is always echoed for
      # debugging; a non-zero wrangler exit still fails the step.
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEPLOY_OUTPUT=$(pnpm exec wrangler deploy --env preview 2>&1)
          else
            # `--env=""` explicitly targets the top-level (production) config.
            # Because a named environment ([env.preview]) exists, a bare
            # `wrangler deploy` warns about an unspecified environment; the
            # empty-string form is wrangler's documented way to select top-level.
            DEPLOY_OUTPUT=$(pnpm exec wrangler deploy --env="" 2>&1)
          fi
          STATUS=$?
          set -e
          echo "$DEPLOY_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "wrangler deploy failed with status $STATUS" >&2
            exit "$STATUS"
          fi
          # `|| true`: grep exits 1 when no URL is present (e.g. workers.dev
          # not yet enabled on a first deploy). Under the runner's pipefail
          # shell that would fail this step even though the deploy succeeded.
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' | head -1 || true)
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      # === ENABLE workers.dev SUBDOMAIN (idempotent) ===
      # Makes the deployed Worker reachable at
      # `<script>.<account>.workers.dev`. Event-aware script name so a PR
      # enables it for the preview Worker, main for production. Tolerant:
      # error code 10056 means "already configured".
      - name: Enable workers.dev subdomain (idempotent)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCRIPT_NAME="zfb-example-webshop-preview"
          else
            SCRIPT_NAME="zfb-example-webshop"
          fi
          RESPONSE=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true}')
          echo "$RESPONSE"
          # code 10056 = already configured — treat as success
          CODE=$(echo "$RESPONSE" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log((j.errors||[]).map(e=>e.code).join(','))")
          if [ -n "$CODE" ] && [ "$CODE" != "10056" ]; then
            echo "Unexpected error code(s): $CODE" >&2
            exit 1
          fi

      # === STICKY PR PREVIEW COMMENT ===
      # Post/update a single comment pointing at the preview Worker URL.
      - name: Upsert sticky PR preview comment
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deploy_url }}
        with:
          # github-token passed explicitly: implicit detection can 401 with
          # "Bad credentials" on SHA-pinned action runs.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- cf-workers-preview-pr -->';
            const previewUrl = process.env.PREVIEW_URL;
            const shortSha = context.sha.substring(0, 7);
            const body = previewUrl
              ? `${marker}\n### Cloudflare Workers preview\n\nPreview Worker \`zfb-example-webshop-preview\` is live at: ${previewUrl}\n\n_Deployed against the isolated \`webshop-preview\` D1 database — never touches production shop data. Updated for commit \`${shortSha}\`._`
              : `${marker}\n### Cloudflare Workers preview\n\n⏳ Preview Worker deployed, but the workers.dev URL could not be parsed from the deploy output — check the "Deploy Worker" step logs.\n\n_Updated for commit \`${shortSha}\`._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
